[project]
name = "sbem-ui"
version = "0.1.0"
description = "Svelte-based UI for creating SBEM model artifacts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "python-multipart>=0.0.6",
    # globi sets the epinterface version, so sbem-ui edits the same component db globi simulates.
    # Only import globi.models / globi.gis: globi.pipelines and globi.allocate create
    # Hatchet / boto3 clients at import time.
    "globi",
    "epinterface",
    # semantic_priors is vendored in lib/ (see lib/semantic_priors/VENDORED.md)
    "networkx",
    "numpy",
    "pandas",
    "prisma~=0.15.0",
    "anthropic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]

# globi's source (and uv settings such as link-mode) come from the globi-toolkit workspace root.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib/sbem_ui", "lib/semantic_priors"]
